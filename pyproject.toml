[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecasting-a-world-that-accelerates"
version = "2.0.0"
description = "Reference implementation for evidence-grounded, constraint-limited, regime-switching forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/AGPL-3.0-or-later.txt"]
authors = [
  {name = "Vincent Boucher", email = "info@quebec.ai"},
]
maintainers = [
  {name = "MONTREAL.AI", email = "info@quebec.ai"},
]
keywords = ["forecasting", "AI", "acceleration", "regime switching", "decision science", "hindcasting"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "matplotlib>=3.8,<4",
  "networkx>=3.3,<4",
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "types-PyYAML>=6,<7",
  "wheel>=0.45,<1",
  "pip-audit>=2.7,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff==0.16.0",
  "setuptools>=83,<84",
]

[project.scripts]
fwta = "fwta.cli:main"

[project.urls]
Homepage = "https://github.com/MontrealAI/forecasting-a-world-that-accelerates"
Repository = "https://github.com/MontrealAI/forecasting-a-world-that-accelerates"
Issues = "https://github.com/MontrealAI/forecasting-a-world-that-accelerates/issues"
Paper = "https://github.com/MontrealAI/forecasting-a-world-that-accelerates/releases"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: full deterministic reproduction checks run outside the coverage pass"]

[tool.coverage.run]
branch = true
source = ["fwta"]
omit = ["src/fwta/__main__.py", "src/fwta/experiments.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "matplotlib.*", "networkx.*", "scipy.*"]
ignore_missing_imports = true
