evidence:
- id: controlled-reference-series
  title: FWAA deterministic controlled capacity series v2.0.0
  publisher: MONTREAL.AI
  source_url: https://github.com/MontrealAI/forecasting-a-world-that-accelerates
  quality_grade: A
  measurement_date: '2026-07-28'
  publication_date: '2026-07-28'
