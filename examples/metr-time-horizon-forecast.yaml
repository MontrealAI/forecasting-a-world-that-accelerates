scenarios:
- id: base
  label: Base
  kind: base
  probability: 0.58
  parameters: {}
  assumptions:
  - Model-averaged historical dynamics continue within the benchmark definition.
  invalidation_conditions:
  - A benchmark version change breaks comparability.
- id: accelerated
  label: Accelerated
  kind: accelerated
  probability: 0.2
  parameters:
    annual_growth_shift: 0.08
    annual_acceleration_shift: 0.05
  assumptions:
  - Recent acceleration persists.
  invalidation_conditions:
  - Recent-window growth falls materially below the prior window.
- id: downside
  label: Saturation / measurement stress
  kind: downside
  probability: 0.17
  parameters:
    annual_drag: 0.18
    immediate_multiplier: 0.98
    floor_multiplier: 0.6
  assumptions:
  - Benchmark saturation or measurement limitations dominate.
  invalidation_conditions:
  - Fresh harder tasks preserve comparable headroom.
- id: discontinuous
  label: Discontinuous
  kind: discontinuous
  probability: 0.05
  parameters:
    annual_transition_hazard: 0.15
    jump_multiplier: 1.15
    growth_rate_compounding: 0.25
    initial_growth_bonus: 0.12
  assumptions:
  - A structural improvement loop materially changes the trajectory.
  invalidation_conditions:
  - No verified regime-change signal appears.
canonical_model:
  mode: reduced_form
  input_series_semantics: realized_outcome
milestones:
- id: suite-limit
  label: Published approximate 16-hour reliability boundary
  threshold: 960
  direction: at_least
  prerequisites:
  - Measurement remains within a valid benchmark range.
bottlenecks:
- name: Benchmark measurement range
  severity: critical
  mechanism: The published task suite becomes unreliable above approximately 16 hours.
  release_condition: A validated harder task suite extends the measurable range.
  mitigation: Treat 960 minutes as a measurement boundary, not a capability ceiling.
  evidence_ids:
  - metr-time-horizon-1-1
triggers:
- name: New official METR release
  direction: event
  threshold: New version or measurement
  forecast_effect: Changes the evidence clock and possibly the measurement regime.
  action: Recalculate immediately with frozen upstream data.
  evidence_ids:
  - metr-time-horizon-1-1
optimal_plan:
  no_regret_actions:
  - Freeze source snapshots and record benchmark/configuration changes.
  - Use rolling-origin scores rather than in-sample fit alone.
  option_preserving_actions:
  - Maintain multiple model classes and trigger-based recalibration.
  next_experiment:
  - Add the complete upstream dataset and rerun the preregistered hindcast.
  delay_pending_evidence:
  - Do not translate benchmark movement directly into revenue or deployment.
  stop_expand_pivot:
  - Expand confidence only after independent replication and prospective calibration.
assumptions:
- The selected within-range observations are sufficiently comparable for an illustrative
  reduced-form fit.
limitations:
- Small, incomplete, hand-transcribed excerpt.
- Benchmark horizon is not runtime, autonomy duration, or economy-wide automation.
- The 960-minute cap represents a measurement boundary.
recalculation:
  scheduled_date: '2026-08-27'
  early_triggers:
  - New official METR measurement
  - Benchmark methodology revision
  required_evidence:
  - Complete official data freeze
  - Updated benchmark version notes
