# final-trigger: 2026-07-29T00:30Z
name: Repair PR quality gates

on:
  push:
    branches: [feat/autonomous-github-pages]
    paths:
      - ".github/workflows/repair-pr.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-autonomous-pages-pr
  cancel-in-progress: false

jobs:
  repair:
    name: Apply and verify all release-gate repairs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/autonomous-github-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the locally verified repair patch
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode .github/repair/core.patch.gz.b64 | gzip --decompress > /tmp/fwaa-core.patch
          patch -p1 --forward --batch < /tmp/fwaa-core.patch

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          env:
            SOURCE_DATE_EPOCH: "1785254400"
            PYTHONHASHSEED: "0"
            TZ: "UTC"
            MPLCONFIGDIR: ".cache/matplotlib"
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONUNBUFFERED: "1"

          jobs:
            quality:
              name: quality-and-scientific-integrity
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: pyproject.toml
                - run: python -m pip install -e '.[dev]'
                - name: Lint, format, and type-check
                  run: |
                    python -m ruff check src tests experiments scripts
                    python -m ruff format --check src tests experiments scripts
                    python -m mypy src
                - name: Tests and branch coverage
                  run: |
                    python -m pytest -q
                    python -m pytest -q -m "not slow" --cov=fwta --cov-branch --cov-report=term-missing --cov-report=xml
                - name: Validate all protocol examples
                  run: make schemas
                - name: End-to-end probabilistic forecast
                  run: make forecast
                - name: Controlled and public-evidence experiments
                  run: make experiments empirical
                - name: Verify prospective registry and generate SBOM
                  run: make registry sbom
                - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                  with:
                    name: scientific-artifacts
                    path: |
                      coverage.xml
                      results/ceiling/
                      results/empirical/
                      release/sbom.cdx.json
                    if-no-files-found: error
                    retention-days: 30

            compatibility:
              name: compatibility / ${{ matrix.os }} / Python ${{ matrix.python-version }}
              runs-on: ${{ matrix.os }}
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, macos-latest, windows-latest]
                  python-version: ["3.11", "3.13"]
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                    cache-dependency-path: pyproject.toml
                - run: python -m pip install -e '.[dev]'
                - run: python -m pytest -q
                - name: Forecast smoke test
                  shell: bash
                  run: python -m fwta forecast protocol/v2/examples/smoke-input.yaml --schema protocol/v2/input.schema.json --output tmp/forecast.json --report tmp/forecast.html --output-schema protocol/v2/output.schema.json

            distribution:
              name: wheel-and-source-distribution-smoke-test
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: pyproject.toml
                - name: Install runtime and distribution verification dependencies
                  run: python -m pip install -e '.[dev]' 'setuptools>=77,<83' 'ruff==0.16.0'
                - run: python scripts/build_python_distribution.py --outdir dist
                - name: Smoke-test wheel and source distribution
                  run: make smoke
          YAML

          python - <<'PY'
          from pathlib import Path
          import re

          pages = Path(".github/workflows/pages.yml")
          text = pages.read_text(encoding="utf-8")
          text = re.sub(
              r"(?m)^  group: .+$",
              "  group: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}",
              text,
              count=1,
          )
          text = text.replace(
              "if: github.event_name != 'pull_request'",
              "if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')",
          )
          pages.write_text(text, encoding="utf-8")

          page404 = Path("site/404.html")
          text = page404.read_text(encoding="utf-8")
          text = text.replace('href="favicon.svg"', 'href="/forecasting-a-world-that-accelerates/favicon.svg"')
          text = text.replace('href="./"', 'href="/forecasting-a-world-that-accelerates/"')
          text = text.replace('href="paper.html"', 'href="/forecasting-a-world-that-accelerates/paper.html"')
          page404.write_text(text, encoding="utf-8")
          PY

          rm -f .github/repair/core.patch.gz.b64
          rm -f .github/repair/chunk-00 .github/repair/chunk-01
          rm -f .github/workflows/repair-pr.yml

      - name: Install the repaired project
        run: python -m pip install -e '.[dev]' 'setuptools>=77,<83' 'ruff==0.16.0'

      - name: Verify lint, types, tests, wheel, sdist, and clean smoke forecasts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check src tests experiments scripts
          python -m ruff format --check src tests experiments scripts
          python -m mypy src
          python -m pytest -q
          python scripts/build_python_distribution.py --outdir dist
          make smoke
          git diff --check

      - name: Commit the verified repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "ci: repair all release quality gates"
          git push origin HEAD:feat/autonomous-github-pages
