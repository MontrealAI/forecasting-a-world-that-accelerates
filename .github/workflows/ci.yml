name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "1785254400"
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  MPLCONFIGDIR: ".cache/matplotlib"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: quality-and-scientific-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint, format, and type-check
        run: |
          python -m ruff check src tests experiments scripts
          python -m ruff format --check src tests experiments scripts
          python -m mypy src
      - name: Tests and branch coverage
        run: |
          python -m pytest -q
          python -m pytest -q -m "not slow" --cov=fwta --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Validate all protocol examples
        run: make schemas
      - name: End-to-end probabilistic forecast
        run: make forecast
      - name: Controlled and public-evidence experiments
        run: make experiments empirical
      - name: Verify prospective registry and generate SBOM
        run: make registry sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-artifacts
          path: |
            coverage.xml
            results/ceiling/
            results/empirical/
            release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  compatibility:
    name: compatibility / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Forecast smoke test
        shell: bash
        run: python -m fwta forecast protocol/v2/examples/smoke-input.yaml --schema protocol/v2/input.schema.json --output tmp/forecast.json --report tmp/forecast.html --output-schema protocol/v2/output.schema.json

  distribution:
    name: wheel-and-source-distribution-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and distribution verification dependencies
        run: python -m pip install -e '.[dev]'
      - run: python scripts/build_python_distribution.py --outdir dist
      - name: Smoke-test wheel and source distribution
        run: make smoke
