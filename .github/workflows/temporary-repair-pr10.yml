name: Temporary repair PR 10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-repair-pr10.yml"

permissions:
  contents: write

concurrency:
  group: temporary-repair-pr10
  cancel-in-progress: false

jobs:
  repair:
    name: Restore and verify final core files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/autonomous-github-pages
          fetch-depth: 0

      - name: Restore locally validated core files
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .github/repair/core-final.b64
          base64 --decode .github/repair/core-final.b64 | tar -xz -C .
          rm -f .github/repair/core-final.b64
          rm -f .github/workflows/apply-core-repair.yml
          git diff --check

      - name: Verify complete repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[dev]' 'setuptools>=77,<83' 'ruff==0.16.0'
          python -m ruff check src tests experiments scripts
          python -m ruff format --check src tests experiments scripts
          python -m mypy src
          python -m pytest -q
          python scripts/build_python_distribution.py --outdir dist
          make smoke

      - name: Commit repaired branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "quality: finalize core model reporting and uncertainty repairs"
          git push origin HEAD:feat/autonomous-github-pages
