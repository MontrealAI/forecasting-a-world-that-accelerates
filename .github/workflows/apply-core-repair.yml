name: Apply final core repair

on:
  push:
    branches: [feat/autonomous-github-pages]
    paths:
      - ".github/workflows/apply-core-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-core-repair
  cancel-in-progress: false

jobs:
  apply:
    name: Apply locally validated core source files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/autonomous-github-pages
          fetch-depth: 0

      - name: Restore the validated core source files
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode .github/repair/core-final.b64 | tar -xz -C .
          rm -f .github/repair/core-final.b64
          rm -f .github/workflows/apply-core-repair.yml
          git diff --check

      - name: Verify the repaired core
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[dev]' 'setuptools>=77,<83' 'ruff==0.16.0'
          python -m ruff check src tests experiments scripts
          python -m ruff format --check src tests experiments scripts
          python -m mypy src
          python -m pytest -q
          python scripts/build_python_distribution.py --outdir dist
          make smoke

      - name: Commit the verified core repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "quality: finalize core model reporting and uncertainty repairs"
          git push origin HEAD:feat/autonomous-github-pages
