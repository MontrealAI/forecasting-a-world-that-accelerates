name: Apply validated core repair

on:
  push:
    branches: [feat/autonomous-github-pages]
    paths:
      - ".github/workflows/apply-validated-core.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-validated-core.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-validated-core-pr10
  cancel-in-progress: false

jobs:
  repair:
    name: Restore and verify final pull-request state
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/autonomous-github-pages
          fetch-depth: 0

      - name: Restore checksum-verified core files
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/repair2/core4.part00 \
              .github/repair2/core4.part01 \
              .github/repair2/core4.part02 \
              .github/repair2/core4.part03 \
              .github/repair2/core4.part04 \
              .github/repair2/core4.part05 > /tmp/core4.b64
          echo "f6f47a7fa6559d67c86ba05bfc6a795306ce836545cbb2dc3d9b1bc190c2e83a  /tmp/core4.b64" | sha256sum --check --strict
          base64 --decode /tmp/core4.b64 > /tmp/core4.tar.gz
          echo "134a251b1ee32ed8326fdd82c79b28c330874714b7b96e9822c23d831efbcc2e  /tmp/core4.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/core4.tar.gz -C .

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install verification toolchain
        run: python -m pip install -e '.[dev]' 'setuptools>=77,<83' 'ruff==0.16.0'

      - name: Finalize Pages safeguards and remove repair machinery
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          pages = Path(".github/workflows/pages.yml")
          text = pages.read_text(encoding="utf-8")
          for old_group in (
              "  group: github-pages-${{ github.event_name }}-${{ github.ref }}\n",
              "  group: pages\n",
          ):
              text = text.replace(
                  old_group,
                  "  group: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}\n",
              )
          text = text.replace(
              "if: github.event_name != 'pull_request'",
              "if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')",
          )
          pages.write_text(text, encoding="utf-8")

          page404 = Path("site/404.html")
          text = page404.read_text(encoding="utf-8")
          text = text.replace('href="favicon.svg"', 'href="/forecasting-a-world-that-accelerates/favicon.svg"')
          text = text.replace('href="./"', 'href="/forecasting-a-world-that-accelerates/"')
          text = text.replace('href="paper.html"', 'href="/forecasting-a-world-that-accelerates/paper.html"')
          page404.write_text(text, encoding="utf-8")
          PY

          rm -rf .github/repair .github/repair2
          rm -f .github/workflows/apply-core-repair.yml
          rm -f .github/workflows/finalize-quality.yml
          rm -f .github/workflows/apply-validated-core.yml

      - name: Canonicalize source formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix --unsafe-fixes src tests experiments scripts || true
          python -m ruff format src tests experiments scripts

      - name: Verify all local release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check src tests experiments scripts
          python -m ruff format --check src tests experiments scripts
          python -m mypy src
          python -m pytest -q
          python scripts/build_python_distribution.py --outdir dist
          make smoke
          git diff --check

      - name: Commit and push verified state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "ci: finalize all release quality gates"
          git push origin HEAD:feat/autonomous-github-pages
