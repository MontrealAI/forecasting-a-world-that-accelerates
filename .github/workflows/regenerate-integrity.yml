name: Regenerate final integrity records

on:
  push:
    branches: [feat/autonomous-github-pages]
    paths:
      - ".github/workflows/regenerate-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-final-integrity-pr10
  cancel-in-progress: false

jobs:
  regenerate:
    name: Rebuild, verify, and commit final integrity records
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/autonomous-github-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install verified Python and scientific TeX toolchains
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-linuxlibertine latexmk poppler-utils texlive-bibtex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra \
            texlive-pictures texlive-science texlive-xetex
          sudo fc-cache -f
          fc-match "Linux Biolinum O"
          fc-match "Linux Libertine O"

      - name: Remove this one-shot workflow before hashing the repository
        run: rm -f .github/workflows/regenerate-integrity.yml

      - name: Rebuild all release evidence and integrity records
        shell: bash
        run: |
          set -Eeuo pipefail
          make finalization
          make manifest
          PYTHONPATH=src python scripts/check_release.py
          git diff --check

      - name: Commit verified integrity records
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "release: regenerate final integrity records"
          git push origin HEAD:feat/autonomous-github-pages
