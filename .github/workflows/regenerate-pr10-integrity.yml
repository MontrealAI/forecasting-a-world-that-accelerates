name: Regenerate PR 10 integrity records

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-pr10-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-pr10-integrity
  cancel-in-progress: false

jobs:
  regenerate:
    name: Rebuild, verify, and commit PR 10 integrity records
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/autonomous-github-pages
          fetch-depth: 0

      - name: Incorporate current main and remove one-shot workflows before hashing
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/regenerate-pr10-integrity.yml
          rm -f .github/workflows/regenerate-integrity.yml
          rm -f .github/workflows/temporary-repair-pr10.yml
          rm -f .github/workflows/repair-pr10-final.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install verified Python and scientific TeX toolchains
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-linuxlibertine latexmk poppler-utils texlive-bibtex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra \
            texlive-pictures texlive-science texlive-xetex
          sudo fc-cache -f
          fc-match "Linux Biolinum O"
          fc-match "Linux Libertine O"

      - name: Rebuild every local release gate and integrity record
        shell: bash
        run: |
          set -Eeuo pipefail
          make finalization
          make manifest
          PYTHONPATH=src python scripts/check_release.py
          git diff --check

      - name: Commit verified final state to pull request 10
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "release: regenerate final integrity records"
          git push origin HEAD:feat/autonomous-github-pages
