name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "paper/preprint.pdf"
      - "protocol/**"
      - "results/ceiling/reference-forecast.html"
      - "results/empirical/metr-forecast.html"
      - "results/empirical/swe-bench-forecast.html"
      - "README.md"
      - "CITATION.cff"
      - "LICENSE"
      - "LICENSE.md"
      - "NOTICE"
      - "VERSION"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "paper/preprint.pdf"
      - "protocol/**"
      - "results/ceiling/reference-forecast.html"
      - "results/empirical/metr-forecast.html"
      - "results/empirical/swe-bench-forecast.html"
      - "README.md"
      - "CITATION.cff"
      - "LICENSE"
      - "LICENSE.md"
      - "NOTICE"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build publication website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble and verify the static publication site
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s paper/preprint.pdf
          test "$(head -c 5 paper/preprint.pdf)" = "%PDF-"
          test -s protocol/prompt.md
          test -s protocol/protocol-specification.json
          test -s results/ceiling/reference-forecast.html
          test -s results/empirical/metr-forecast.html
          test -s results/empirical/swe-bench-forecast.html

          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          SHORT_SHA="${GITHUB_SHA::12}"
          PAPER_SHA256="$(sha256sum paper/preprint.pdf | awk '{print $1}')"

          rm -rf _site
          mkdir -p _site/reports _site/downloads

          cp -a site/. _site/
          cp paper/preprint.pdf _site/paper.pdf
          cp paper/preprint.pdf "_site/downloads/Forecasting_A_World_That_Accelerates_v${VERSION_VALUE}.pdf"
          cp protocol/prompt.md _site/prompt.md
          cp protocol/protocol-specification.json _site/protocol-specification.json
          cp protocol/*.schema.json _site/
          cp -R protocol/v2 _site/v2
          cp results/ceiling/reference-forecast.html _site/reports/reference-forecast.html
          cp results/empirical/metr-forecast.html _site/reports/metr-forecast.html
          cp results/empirical/swe-bench-forecast.html _site/reports/swe-bench-forecast.html
          cat > _site/repository-guide.md <<'EOF'
          # Repository guide

          The authoritative, version-controlled repository guide is the GitHub README:

          [Open the complete repository guide](https://github.com/MontrealAI/forecasting-a-world-that-accelerates#readme)
          EOF
          cp CITATION.cff _site/CITATION.cff
          cp LICENSE _site/LICENSE
          cp LICENSE.md _site/LICENSE.md
          cp NOTICE _site/NOTICE
          touch _site/.nojekyll

          while IFS= read -r -d '' file; do
            sed -i \
              -e "s/__FWAA_VERSION__/${VERSION_VALUE}/g" \
              -e "s/__FWAA_COMMIT__/${SHORT_SHA}/g" \
              -e "s/__FWAA_PAPER_SHA256__/${PAPER_SHA256}/g" \
              "${file}"
          done < <(find _site -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0)

          cat > _site/build.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "version": "${VERSION_VALUE}",
            "commit": "${GITHUB_SHA}",
            "paper_sha256": "${PAPER_SHA256}",
            "workflow_run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

          (
            cd _site
            sha256sum \
              paper.pdf \
              "downloads/Forecasting_A_World_That_Accelerates_v${VERSION_VALUE}.pdf" \
              prompt.md \
              protocol-specification.json \
              reports/reference-forecast.html \
              reports/metr-forecast.html \
              reports/swe-bench-forecast.html \
              CITATION.cff \
              LICENSE \
              LICENSE.md \
              NOTICE \
              > SHA256SUMS.txt
            find . -type f -name '*.schema.json' -print0 | sort -z | xargs -0 sha256sum >> SHA256SUMS.txt
          )

          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path("_site").resolve()
          repository_prefix = "/forecasting-a-world-that-accelerates/"
          missing = []

          class LocalLinkChecker(HTMLParser):
              def __init__(self, source: Path) -> None:
                  super().__init__()
                  self.source = source

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  for key, value in attrs:
                      if key not in {"href", "src", "data"} or not value:
                          continue
                      if value.startswith(("#", "mailto:", "tel:", "javascript:", "//")):
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or parsed.netloc or not parsed.path:
                          continue
                      decoded = unquote(parsed.path)
                      if decoded.startswith(repository_prefix):
                          decoded = decoded[len(repository_prefix):]
                      relative = Path(decoded)
                      target = root / relative.as_posix().lstrip("/") if relative.is_absolute() else self.source.parent / relative
                      if target.is_dir():
                          target = target / "index.html"
                      if not target.exists():
                          missing.append(f"{self.source.relative_to(root)} -> {value}")

          for page in sorted(root.rglob("*.html")):
              parser = LocalLinkChecker(page)
              parser.feed(page.read_text(encoding="utf-8"))

          specification = json.loads((root / "protocol-specification.json").read_text(encoding="utf-8"))
          for label, relative_path in specification["schemas"].items():
              if not (root / relative_path).is_file():
                  missing.append(f"protocol schema {label} -> {relative_path}")

          if missing:
              raise SystemExit("Broken publication references:\n" + "\n".join(missing))

          required = [
              "index.html",
              "paper.html",
              "paper.pdf",
              "prompt.md",
              "protocol-specification.json",
              "evidence-record.schema.json",
              "task-graph.schema.json",
              "hindcast-case.schema.json",
              "protocol-envelope.schema.json",
              "v2/input.schema.json",
              "v2/output.schema.json",
              "v2/registry-record.schema.json",
              "reports/reference-forecast.html",
              "reports/metr-forecast.html",
              "reports/swe-bench-forecast.html",
              "SHA256SUMS.txt",
              "build.json",
              ".nojekyll",
          ]
          absent = [item for item in required if not (root / item).exists()]
          if absent:
              raise SystemExit("Required publication files missing:\n" + "\n".join(absent))

          print(f"Verified {len(list(root.rglob('*')))} publication paths, schemas, and local HTML links.")
          PY

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy publication website
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
