name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "1785254400"
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  MPLCONFIGDIR: ".cache/matplotlib"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and audit tooling
        run: python -m pip install -e '.[dev]'
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Scan release tree and required controls
        run: PYTHONPATH=src python scripts/preflight_release.py --root .
