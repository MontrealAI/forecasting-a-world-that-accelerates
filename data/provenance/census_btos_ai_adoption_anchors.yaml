method:
  - Transcribed selected published national anchors and their stated reference periods.
  - Assigned comparability groups from the published measure definitions.
  - Marked approximated dates and rounded values rather than presenting them as exact observations.
  - Treated the change from goods-or-services use to any-business-function use as a structural measurement break.
limitations:
  - This is a selective excerpt rather than the full BTOS microdata or time series.
  - Survey estimates carry sampling and non-sampling uncertainty not reproduced in this excerpt.
  - Dates marked as approximations must not be interpreted as exact survey endpoints.
